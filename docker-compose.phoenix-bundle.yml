# =============================================================================
# ContextForge + Arize Phoenix with an existing PostgreSQL database
# =============================================================================
#
# Start the two images shipped in the release bundle:
#
#   gateway    ${GATEWAY_IMAGE:-mcpgateway/mcpgateway:latest}   this service
#   phoenix    arizephoenix/phoenix:latest                      trace backend
#
# Quick start (after loading the release bundle):
#
#   docker load -i mcpgateway-<version>-linux-amd64.tar.gz
#
#   # Compose reads secrets from a .env file in this file's directory. Either
#   # place a .env next to this compose file, or export the variables first:
#   export JWT_SECRET_KEY=...
#   export AUTH_ENCRYPTION_SECRET=...
#   export PLATFORM_ADMIN_PASSWORD=...
#   export DEFAULT_USER_PASSWORD=...
#   export GATEWAY_DATABASE_URL=postgresql+psycopg://user:password@db-host:5432/mcp
#
#   docker compose -f docker-compose.phoenix-bundle.yml up -d
#
# Endpoints:
#   http://localhost:4444        ContextForge gateway
#   http://localhost:6006        Phoenix UI (traces land in the "mcp-gateway" project)
#   http://localhost:4317        Phoenix OTLP gRPC ingest
#
# Notes:
#   - This file uses the Phoenix service hostname for OpenTelemetry exports.
#   - Set GATEWAY_DATABASE_URL to an existing database reachable from the gateway.
#   - Config validation rejects short or placeholder secrets, so the four
#     variables above must hold real values.
#   - To connect to a database on the Docker host, use:
#       GATEWAY_DATABASE_URL=postgresql+psycopg://postgres:<password>@host.docker.internal:5432/mcp
#     The host-gateway alias below makes host.docker.internal resolve on Linux too.
# =============================================================================

name: mcpgateway-phoenix

services:
  # ---------------------------------------------------------------------------
  # Arize Phoenix — OTLP collector, UI, and evaluation backend
  # ---------------------------------------------------------------------------
  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    container_name: phoenix
    restart: unless-stopped
    environment:
      - PHOENIX_WORKING_DIR=/data
      - PHOENIX_LOG_LEVEL=info
    ports:
      - "${PHOENIX_UI_PORT:-6006}:6006"     # Web UI + OTLP HTTP (/v1/traces)
      - "${PHOENIX_OTLP_PORT:-4317}:4317"   # OTLP gRPC ingest
    volumes:
      - phoenix-data:/data
    healthcheck:
      # The Phoenix image ships neither curl nor wget, so probe with python.
      test: ["CMD", "python3", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ContextForge gateway — OTLP tracing pointed at Phoenix
  # ---------------------------------------------------------------------------
  gateway:
    image: ${GATEWAY_IMAGE:-mcpgateway/mcpgateway:latest}
    container_name: mcpgateway
    restart: unless-stopped
    depends_on:
      phoenix:
        condition: service_healthy
    extra_hosts:
      # Lets GATEWAY_DATABASE_URL use host.docker.internal on Linux as well.
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - MCPGATEWAY_SKIP_MIGRATIONS=false

      - DATABASE_URL=${GATEWAY_DATABASE_URL:?Set GATEWAY_DATABASE_URL to an existing PostgreSQL connection}

      # Secrets — no defaults on purpose. Export them, or run from the repo root
      # so the .env file supplies them. Config validation rejects short or
      # placeholder values, so these must be real secrets.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - export it or run from the repository root where .env defines it}
      - AUTH_ENCRYPTION_SECRET=${AUTH_ENCRYPTION_SECRET:?AUTH_ENCRYPTION_SECRET is required - export it or run from the repository root where .env defines it}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required when EMAIL_AUTH_ENABLED is true - export it or run from the repository root where .env defines it}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD is required when EMAIL_AUTH_ENABLED is true - export it or run from the repository root where .env defines it}
      # Only validated when API_ALLOW_BASIC_AUTH or DOCS_ALLOW_BASIC_AUTH is enabled.
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}

      # OpenTelemetry export to Phoenix. Hostnames are the compose service names.
      - OTEL_ENABLE_OBSERVABILITY=true
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=mcp-gateway
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=mcp-gateway,deployment.environment=docker
      # High-volume SQL spans. Turn on to see individual queries in Phoenix.
      - OTEL_SQLALCHEMY_INSTRUMENTATION_ENABLED=${OTEL_SQLALCHEMY_INSTRUMENTATION_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-4444}:4444"

volumes:
  phoenix-data:
