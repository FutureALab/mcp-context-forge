# ==============================================================================
# Docker Release Bundle
# ==============================================================================
#
# Build the gateway and bundle Phoenix, source, and deployment files.
# Publish a Release after every requested architecture passes deployment checks.
#
# Triggers:
#   - release: published  Builds amd64 and arm64 bundles for the released tag and
#                         attaches both archives plus docker-compose.yaml.
#   - workflow_dispatch   Creates a build Release when release_tag is empty.
#                         Set release_tag to attach to an existing release.
#
# Registry pushes, multiplatform manifests, and Cosign signing stay in
# docker-multiplatform.yml. This workflow never pushes to a registry.
#
# Release assets:
#   contextforge-<version>-linux-<arch>.tar.gz      complete offline deployment
#   contextforge-<version>-linux-<arch>.tar.gz.sha256  checksum
#   mcpgateway-<version>-linux-<arch>.tar.gz         docker save archive, two images
#   mcpgateway-<version>-linux-<arch>.tar.gz.sha256  checksum
#   contextforge-deployment-docs-<version>-linux-<arch>.tar.gz  deployment guides and parent helper
#   docker-compose.yaml                              gateway + phoenix; existing PostgreSQL
#
# Load and run on the target host:
#   sha256sum --check contextforge-<version>-linux-amd64.tar.gz.sha256
#   tar -xzf contextforge-<version>-linux-amd64.tar.gz
#   cd contextforge-<version>-linux-amd64
#   sha256sum -c SHA256SUMS
#   docker load -i images.tar.gz
#   bash init-env.sh
#   # Set GATEWAY_DATABASE_URL in .env to an existing PostgreSQL connection.
#   docker compose up -d --pull never
#
# Images inside each archive:
#   mcpgateway/mcpgateway:<version>   mcpgateway/mcpgateway:<tag>
#   mcpgateway/mcpgateway:latest      ghcr.io/<owner>/<repo>:<tag>
#   arizephoenix/phoenix:latest
#
# The compose file is generated from docker-compose.phoenix-bundle.yml, with the
# gateway image pinned to the released version.
# ==============================================================================

name: Docker Release Bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach to (empty creates a new build Release)"
        required: false
        type: string
      source_ref:
        description: "Git ref to build (empty builds the dispatched ref, or the release tag when release_tag is set)"
        required: false
        type: string
      architectures:
        description: "Architecture bundles to build"
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
          - both
      enable_rust:
        description: "Enable the Rust MCP runtime (Containerfile ENABLE_RUST=true)"
        required: true
        default: false
        type: boolean
      phoenix_image:
        description: "Arize Phoenix image to bundle"
        required: false
        default: "arizephoenix/phoenix:latest"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Resolve the Docker tag, version, checkout ref, and build matrix.
  # ---------------------------------------------------------------
  prepare:
    name: Resolve bundle metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      matrix: ${{ steps.meta.outputs.matrix }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      upload_release: ${{ steps.meta.outputs.upload_release }}
      phoenix_image: ${{ steps.meta.outputs.phoenix_image }}
    steps:
      - name: Checkout the requested source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.inputs.source_ref || github.event.release.tag_name || github.event.inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Resolve tag, version and build matrix
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          INPUT_ARCHITECTURES: ${{ github.event.inputs.architectures }}
          INPUT_PHOENIX_IMAGE: ${{ github.event.inputs.phoenix_image }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Docker tags and file names accept only [A-Za-z0-9_.-]. Map anything
          # else to a dash and trim invalid leading and trailing characters.
          sanitize() {
            printf '%s' "${1}" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[^A-Za-z0-9]+//; s/[^A-Za-z0-9]+$//'
          }

          if [[ "${EVENT_NAME}" == "release" ]]; then
            RELEASE_TARGET="${RELEASE_TAG}"
            UPLOAD_RELEASE="true"
            ARCHS="amd64,arm64"
            CHECKOUT_REF="${RELEASE_TAG}"
          else
            if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
              RELEASE_TARGET="${INPUT_RELEASE_TAG}"
              UPLOAD_RELEASE="true"
            else
              RELEASE_TARGET=""
              UPLOAD_RELEASE="false"
            fi

            case "${INPUT_ARCHITECTURES:-amd64}" in
              both) ARCHS="amd64,arm64" ;;
              amd64|arm64) ARCHS="${INPUT_ARCHITECTURES}" ;;
              *) echo "Unsupported architectures input: ${INPUT_ARCHITECTURES}" >&2; exit 1 ;;
            esac

            # An explicit source_ref wins. Otherwise attach-to-release builds the
            # release's own commit, and a plain dispatch builds the dispatched ref.
            if [[ -n "${INPUT_SOURCE_REF:-}" ]]; then
              CHECKOUT_REF="${INPUT_SOURCE_REF}"
            elif [[ -n "${RELEASE_TARGET}" ]]; then
              CHECKOUT_REF="${RELEASE_TARGET}"
            else
              CHECKOUT_REF="${REF}"
            fi
          fi

          SHA="$(git rev-parse HEAD)"
          CHECKOUT_REF="${SHA}"
          if [[ -z "${RELEASE_TARGET}" ]]; then
            RELEASE_TARGET="build-${SHA:0:7}-${RUN_ID}-${RUN_ATTEMPT}"
            UPLOAD_RELEASE="true"
          fi
          git check-ref-format "refs/tags/${RELEASE_TARGET}"
          if [[ "${RELEASE_TARGET}" == -* ]]; then
            echo 'Release tag cannot start with a dash.' >&2
            exit 1
          fi
          RAW_TAG="${RELEASE_TARGET}"

          TAG="$(sanitize "${RAW_TAG}")"
          if [[ -z "${TAG}" || ${#TAG} -gt 128 ]]; then
            echo "Cannot derive a valid Docker tag from '${RAW_TAG}'" >&2
            exit 1
          fi

          VERSION="$(sanitize "${TAG#v}")"
          if [[ -z "${VERSION}" ]]; then
            VERSION="${TAG}"
          fi

          IMAGE_REPO="mcpgateway/mcpgateway"
          GHCR_IMAGE="ghcr.io/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # Trace backend bundled alongside the gateway image.
          PHOENIX_IMAGE="${INPUT_PHOENIX_IMAGE:-arizephoenix/phoenix:latest}"
          if [[ "${PHOENIX_IMAGE##*/}" != *:* ]]; then
            PHOENIX_IMAGE="${PHOENIX_IMAGE}:latest"
          fi
          if [[ ! "${PHOENIX_IMAGE}" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
            echo "Invalid bundle image reference" >&2
            exit 1
          fi

          MATRIX="["
          SEP=""
          IFS=',' read -r -a ARCH_LIST <<< "${ARCHS}"
          for ARCH in "${ARCH_LIST[@]}"; do
            case "${ARCH}" in
              amd64) PLATFORM="linux/amd64"; RUNNER="ubuntu-24.04" ;;
              arm64) PLATFORM="linux/arm64"; RUNNER="ubuntu-24.04-arm" ;;
              *) echo "Unsupported architecture: ${ARCH}" >&2; exit 1 ;;
            esac
            MATRIX+="${SEP}{\"platform\":\"${PLATFORM}\",\"runner\":\"${RUNNER}\",\"suffix\":\"${ARCH}\"}"
            SEP=","
          done
          MATRIX+="]"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "image_repo=${IMAGE_REPO}"
            echo "ghcr_image=${GHCR_IMAGE}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "matrix=${MATRIX}"
            echo "release_tag=${RELEASE_TARGET}"
            echo "upload_release=${UPLOAD_RELEASE}"
            echo "phoenix_image=${PHOENIX_IMAGE}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Docker release bundle"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Docker tag | ${TAG} |"
            echo "| Version | ${VERSION} |"
            echo "| Checkout ref | ${CHECKOUT_REF} |"
            echo "| Architectures | ${ARCHS} |"
            echo "| Phoenix image | ${PHOENIX_IMAGE} |"
            echo "| Database | Existing PostgreSQL (not bundled) |"
            if [[ -n "${RELEASE_TARGET}" ]]; then
              echo "| Attach to release | ${RELEASE_TARGET} |"
            else
              echo "| Attach to release | workflow artifacts only |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------
  # Build one image per architecture, save it, and publish the archive.
  # ---------------------------------------------------------------
  bundle:
    name: Bundle ${{ matrix.suffix }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      UPLOAD_RELEASE: ${{ needs.prepare.outputs.upload_release }}
      ENABLE_RUST: ${{ github.event.inputs.enable_rust == 'true' }}
      PHOENIX_IMAGE: ${{ needs.prepare.outputs.phoenix_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: latest

      # `load: true` puts the image in the local daemon so `docker save` can read
      # it. The docker exporter supports one platform per build, hence one job
      # per architecture. `provenance` and `sbom` stay off so the saved archive
      # holds a single image rather than an attestation manifest list.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            ENABLE_RUST=${{ env.ENABLE_RUST }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          # Read the per-architecture cache that docker-multiplatform.yml already
          # populates from the same Containerfile, so a release build reuses the
          # dependency layers instead of paying a cold build. Write only a small
          # dedicated cache to avoid evicting the shared CI cache.
          cache-from: type=gha,scope=containerfile-lite-${{ matrix.suffix }}
          cache-to: type=gha,mode=min,scope=docker-release-bundle-${{ matrix.suffix }}

      - name: Verify the image contains the gateway
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}:${IMAGE_VERSION}"

          docker image inspect "${image}" --format 'Size: {{.Size}} bytes | Arch: {{.Architecture}}'

          reported="$(docker run --rm --entrypoint python3 "${image}" -c 'import mcpgateway; print(mcpgateway.__version__)')"
          echo "Image reports mcpgateway ${reported}"
          if [[ "${reported}" != "${IMAGE_VERSION}" ]]; then
            echo "::warning::Image reports version ${reported}, bundle version is ${IMAGE_VERSION}."
          fi

          docker run --rm --entrypoint /bin/sh "${image}" -c 'test -x /app/docker-entrypoint.sh'
          echo "Gateway entrypoint present."

          docker run --rm --entrypoint python3 "${image}" -c '
          import gettext
          from pathlib import Path
          import mcpgateway

          catalog_dir = Path(mcpgateway.__file__).parent / "translations"
          catalog = gettext.translation("messages", localedir=str(catalog_dir), languages=["zh_CN"])
          translated = catalog.gettext("Language")
          assert translated == "语言", f"Chinese catalog verification failed: {translated!r}"
          print("Chinese translation catalog verified.")
          '

      # Pull the Phoenix variant that matches this architecture and prove it
      # starts, so a broken upstream image fails the release instead of the
      # consumer. The Phoenix image has no shell, so probe /health from the runner.
      - name: Pull and verify Arize Phoenix
        shell: bash
        run: |
          set -euo pipefail

          docker pull --platform "${{ matrix.platform }}" "${PHOENIX_IMAGE}"
          docker image inspect "${PHOENIX_IMAGE}" --format 'Size: {{.Size}} bytes | Arch: {{.Architecture}}'

          container="phoenix-bundle-smoke"
          docker rm -f "${container}" >/dev/null 2>&1 || true
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "${container}" -p 16006:6006 "${PHOENIX_IMAGE}" >/dev/null

          ready="false"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:16006/health >/dev/null 2>&1; then
              ready="true"
              break
            fi
            sleep 2
          done
          docker logs "${container}" 2>&1 | tail -5 || true
          docker rm -f "${container}" >/dev/null 2>&1 || true

          if [[ "${ready}" != "true" ]]; then
            echo "Phoenix container never answered /health on port 6006" >&2
            exit 1
          fi
          echo "Phoenix ${PHOENIX_IMAGE} is healthy."

      - name: Save all deployment images to one gzipped archive
        shell: bash
        run: |
          set -euo pipefail
          archive="mcpgateway-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"

          # One archive holds all Compose images, so an air-gapped
          # host needs a single `docker load`.
          docker save \
            "${IMAGE_REPO}:${IMAGE_VERSION}" \
            "${IMAGE_REPO}:${IMAGE_TAG}" \
            "${IMAGE_REPO}:latest" \
            "${GHCR_IMAGE}:${IMAGE_TAG}" \
            "${PHOENIX_IMAGE}" \
            | gzip -9 > "${archive}"

          # Confirm the archive is a docker save archive before publishing it.
          # Classic and containerd image stores both write manifest.json at the
          # archive root; the optional "./" tolerates a dot-prefixed listing.
          tar -tzf "${archive}" > /tmp/bundle-contents.txt
          if ! grep -qE '^(\./)?manifest\.json$' /tmp/bundle-contents.txt; then
            echo "Archive ${archive} has no manifest.json; not a docker save archive." >&2
            exit 1
          fi

          # Confirm all deployment images are inside. The two
          # image stores record tags in different files, so read both.
          rm -rf /tmp/bundle-check && mkdir -p /tmp/bundle-check
          tar -xzf "${archive}" -C /tmp/bundle-check manifest.json index.json 2>/dev/null || true
          cat /tmp/bundle-check/manifest.json /tmp/bundle-check/index.json > /tmp/bundle-refs.txt 2>/dev/null || true
          if [[ ! -s /tmp/bundle-refs.txt ]]; then
            echo "Archive ${archive} carries no docker image metadata." >&2
            exit 1
          fi
          for ref in "${IMAGE_REPO}:${IMAGE_VERSION}" "${PHOENIX_IMAGE}"; do
            if ! grep -qF "${ref}" /tmp/bundle-refs.txt; then
              echo "Archive ${archive} does not contain ${ref}." >&2
              exit 1
            fi
            echo "Archive contains ${ref}"
          done

          sha256sum "${archive}" | tee "${archive}.sha256"
          ls -lh "${archive}" "${archive}.sha256"

      - name: Package intranet deployment and parent integration guides
        shell: bash
        run: |
          set -euo pipefail
          docs_archive="contextforge-deployment-docs-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"
          tar -czf "${docs_archive}" \
            DEPLOY-INTRANET.md \
            docs/docs/deployment/intranet-portal-gateway.md \
            infra/portal-session-bridge/README.md \
            infra/portal-session-bridge/portal-client.js
          sha256sum "${docs_archive}" > "${docs_archive}.sha256"

      - name: Package complete offline deployment
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_REPO}:${IMAGE_VERSION}" "${PHOENIX_IMAGE}" > "${RUNNER_TEMP}/bundle-images.json"
          python3 .github/scripts/package_release_bundle.py \
            --version "${IMAGE_VERSION}" --architecture "${{ matrix.suffix }}" \
            --gateway-image "${IMAGE_REPO}:${IMAGE_VERSION}" \
            --phoenix-image "${PHOENIX_IMAGE}" \
            --image-archive "mcpgateway-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz" \
            --image-metadata "${RUNNER_TEMP}/bundle-images.json" --output-dir release-assets \
            --build-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify deployment from the complete archive without pulling images
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          archive="contextforge-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"
          sha256sum -c "${archive}.sha256"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/${archive%.tar.gz}"
          sha256sum -c SHA256SUMS
          docker load -i images.tar.gz
          bash init-env.sh
          export COMPOSE_PROJECT_NAME="release-smoke-${GITHUB_RUN_ID}"
          network="${COMPOSE_PROJECT_NAME}-database"
          database="${COMPOSE_PROJECT_NAME}-postgres"
          password="$(openssl rand -hex 32)"
          export GATEWAY_DATABASE_URL="postgresql+psycopg://postgres:${password}@database:5432/mcp"
          export COMPOSE_FILE=docker-compose.yaml:compose.smoke.yaml
          cat > compose.smoke.yaml <<EOF
          networks:
            default:
              name: ${network}
              external: true
          EOF
          cleanup() {
            status=$?
            set +e
            docker compose logs --no-color --tail 50 || true
            docker compose down --volumes --remove-orphans || status=1
            test -z "$(docker compose ps -aq)" || status=1
            docker logs "${database}" --tail 20 || true
            docker rm -fv "${database}" || status=1
            docker network rm "${network}" || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          docker pull --platform "${{ matrix.platform }}" postgres:16-alpine
          docker network create "${network}"
          docker run -d --name "${database}" --network "${network}" --network-alias database \
            -e POSTGRES_PASSWORD="${password}" -e POSTGRES_DB=mcp postgres:16-alpine
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "${database}" pg_isready -U postgres -d mcp; then
              ready=true
              break
            fi
            sleep 2
          done
          test "${ready}" = true
          docker compose config --quiet
          docker compose up -d --pull never --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:4444/health | jq -e '.status == "healthy"'
          curl -fsS http://127.0.0.1:4444/admin/login > login.html
          grep -q '<html' login.html
          asset="$(grep -oE '/static/[^" ]+\.css' login.html | head -1)"
          test -n "${asset}"
          curl -fsS "http://127.0.0.1:4444${asset}" > /dev/null

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "mcpgateway-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"* release-assets/
          cp "contextforge-deployment-docs-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"* release-assets/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-release-bundle-${{ matrix.suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Summarize the bundle
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### contextforge-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"
            echo "Deployment guides and parent helper: contextforge-deployment-docs-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"
            echo ""
            echo '```bash'
            echo "tar -xzf contextforge-${IMAGE_VERSION}-linux-${{ matrix.suffix }}.tar.gz"
            echo "cd contextforge-${IMAGE_VERSION}-linux-${{ matrix.suffix }}"
            echo "sha256sum -c SHA256SUMS"
            echo "docker load -i images.tar.gz"
            echo "bash init-env.sh"
            echo '# Set GATEWAY_DATABASE_URL in .env to an existing PostgreSQL connection.'
            echo "docker compose up -d --pull never"
            echo '```'
            echo ""
            echo "Images inside the archive:"
            echo "- ${IMAGE_REPO}:${IMAGE_VERSION}"
            echo "- ${IMAGE_REPO}:${IMAGE_TAG}"
            echo "- ${IMAGE_REPO}:latest"
            echo "- ${GHCR_IMAGE}:${IMAGE_TAG}"
            echo "- ${PHOENIX_IMAGE}"
            echo ""
            echo "Traces land in the Phoenix project \`mcp-gateway\` (http://localhost:6006)."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------
  # Publish only after every requested architecture passes deployment checks.
  # ---------------------------------------------------------------
  publish-release:
    name: Publish complete Release
    needs: [prepare, bundle]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.upload_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download all deployment assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: docker-release-bundle-*
          merge-multiple: true
          path: release-assets

      - name: Check assets before publishing
        shell: bash
        env:
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          cd release-assets
          test -s docker-compose.yaml
          while IFS= read -r suffix; do
            for prefix in contextforge mcpgateway contextforge-deployment-docs; do
              archive="${prefix}-${IMAGE_VERSION}-linux-${suffix}.tar.gz"
              test -s "${archive}"
              sha256sum -c "${archive}.sha256"
            done
          done < <(printf '%s' "${MATRIX}" | jq -r '.[].suffix')

      - name: Create or update the complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          tag_uri="${RELEASE_TAG//\//%2F}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_uri}" > /dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${SOURCE_SHA}" > /dev/null
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/tags%2F${tag_uri}" --jq .sha)"
          test "${tag_sha}" = "${SOURCE_SHA}" || {
            echo 'Release tag and built source commit differ.' >&2
            exit 1
          }
          created=false
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            {
              echo 'Download contextforge-*-linux-<architecture>.tar.gz and its .sha256 file for offline deployment.'
              echo 'The complete archive includes gateway, Phoenix, source, configuration, and deployment guides.'
              echo 'Set GATEWAY_DATABASE_URL to an existing PostgreSQL connection before starting.'
              echo "Source commit: ${SOURCE_SHA}"
              echo "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > release-notes.md
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" --title "ContextForge ${RELEASE_TAG}" \
              --notes-file release-notes.md --draft --prerelease --latest=false
            created=true
          else
            created="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > release-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = {item['name']: item['size'] for item in json.loads(Path('release-metadata.json').read_text())['assets']}
          for path in Path('release-assets').iterdir():
              assert assets.get(path.name) == path.stat().st_size, f'Missing or incomplete release asset: {path.name}'
          PY
          if [[ "${created}" == true ]]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false
          fi
          url="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
          echo "Release: ${url}" >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------
  # Fail the run when an expected archive is missing from the release.
  # `always()` keeps this check running when one architecture leg fails
  # to upload, so a partial release is reported instead of passing silently.
  # ---------------------------------------------------------------
  verify-release:
    name: Verify release assets
    needs: [prepare, bundle, publish-release]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.upload_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Confirm every bundle is attached
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail

          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          echo "${assets}"

          missing=0
          while IFS= read -r suffix; do
            for name in \
              "mcpgateway-${IMAGE_VERSION}-linux-${suffix}.tar.gz" \
              "mcpgateway-${IMAGE_VERSION}-linux-${suffix}.tar.gz.sha256" \
              "contextforge-${IMAGE_VERSION}-linux-${suffix}.tar.gz" \
              "contextforge-${IMAGE_VERSION}-linux-${suffix}.tar.gz.sha256" \
              "contextforge-deployment-docs-${IMAGE_VERSION}-linux-${suffix}.tar.gz" \
              "contextforge-deployment-docs-${IMAGE_VERSION}-linux-${suffix}.tar.gz.sha256"; do
              if ! grep -qx "${name}" <<< "${assets}"; then
                echo "::error::Release ${RELEASE_TAG} is missing asset ${name}"
                missing=1
              fi
            done
          done < <(printf '%s' "${MATRIX}" | jq -r '.[].suffix')

          if ! grep -qx "docker-compose.yaml" <<< "${assets}"; then
            echo "::error::Release ${RELEASE_TAG} is missing asset docker-compose.yaml"
            missing=1
          fi

          if ((missing == 1)); then
            echo "Release ${RELEASE_TAG} is incomplete." >&2
            exit 1
          fi

          echo "All expected bundles are attached to ${RELEASE_TAG}."
